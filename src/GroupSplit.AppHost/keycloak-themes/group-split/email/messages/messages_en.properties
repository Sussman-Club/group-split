# Group Split copy for the mail Keycloak sends.
#
# Only keys that need to sound like the product are listed; everything else falls
# through to the parent theme. Kept ASCII-only so the file reads the same
# regardless of how a given Keycloak build decodes message bundles.
#
# Two constraints shape what can go in here. These values are MessageFormat
# patterns, so a literal apostrophe would have to be doubled -- the copy simply
# avoids them. And the HTML ones are emitted through kcSanitize, which keeps
# ordinary markup and inline styles but drops anything it considers unsafe, so
# the styling stays to colours, spacing and a border radius. Every mail also
# repeats the link as text, because a styled anchor is the first thing a strict
# mail client throws away.
#
# The {N} arguments are positional and come from the parent theme's templates:
# {0} link, {1} expiry in minutes, {2} realm name, {3} expiry already formatted.

# --- password reset ---
passwordResetSubject=Reset your Group Split password
passwordResetBody=Someone asked to reset the password on your Group Split account.\n\nIf that was you, choose a new password here:\n{0}\n\nThe link expires in {3}. If you did not ask for this, you can ignore this email and your password stays as it is.
passwordResetBodyHtml=<div style="font-family: Arial, Helvetica, sans-serif; background-color: #f5f0e6; color: #2a2a2a; padding: 32px;">\
    <h2 style="color: #22817a; margin: 0 0 16px;">Group Split</h2>\
    <p style="margin: 0 0 16px;">Someone asked to reset the password on your Group Split account.</p>\
    <p style="margin: 0 0 24px;"><a href="{0}" style="background-color: #22817a; color: #ffffff; padding: 12px 20px; border-radius: 10px; text-decoration: none;">Choose a new password</a></p>\
    <p style="margin: 0 0 16px; color: #6b6459;">The link expires in {3}. If you did not ask for this, you can ignore this email and your password stays as it is.</p>\
    <p style="margin: 0; color: #6b6459;">If the button does not work, paste this into your browser:<br>{0}</p>\
    </div>

# --- email verification ---
emailVerificationSubject=Confirm your Group Split email
emailVerificationBody=Welcome to Group Split. Confirm this email address to finish setting up your account:\n{0}\n\nThe link expires in {3}. If you did not create an account, you can ignore this email.
emailVerificationBodyHtml=<div style="font-family: Arial, Helvetica, sans-serif; background-color: #f5f0e6; color: #2a2a2a; padding: 32px;">\
    <h2 style="color: #22817a; margin: 0 0 16px;">Welcome to Group Split</h2>\
    <p style="margin: 0 0 16px;">Confirm this email address to finish setting up your account.</p>\
    <p style="margin: 0 0 24px;"><a href="{0}" style="background-color: #22817a; color: #ffffff; padding: 12px 20px; border-radius: 10px; text-decoration: none;">Confirm my email</a></p>\
    <p style="margin: 0 0 16px; color: #6b6459;">The link expires in {3}. If you did not create an account, you can ignore this email.</p>\
    <p style="margin: 0; color: #6b6459;">If the button does not work, paste this into your browser:<br>{0}</p>\
    </div>

# --- required actions raised by an administrator ---
executeActionsSubject=Finish setting up your Group Split account
executeActionsBody=There are a few things left to set up on your Group Split account.\n\nFinish them here:\n{0}\n\nThe link expires in {3}. If you were not expecting this, you can ignore this email.
executeActionsBodyHtml=<div style="font-family: Arial, Helvetica, sans-serif; background-color: #f5f0e6; color: #2a2a2a; padding: 32px;">\
    <h2 style="color: #22817a; margin: 0 0 16px;">Group Split</h2>\
    <p style="margin: 0 0 16px;">There are a few things left to set up on your Group Split account.</p>\
    <p style="margin: 0 0 24px;"><a href="{0}" style="background-color: #22817a; color: #ffffff; padding: 12px 20px; border-radius: 10px; text-decoration: none;">Finish setting up</a></p>\
    <p style="margin: 0 0 16px; color: #6b6459;">The link expires in {3}. If you were not expecting this, you can ignore this email.</p>\
    <p style="margin: 0; color: #6b6459;">If the button does not work, paste this into your browser:<br>{0}</p>\
    </div>
