# Group Split account console theme.
#
# Parents keycloak.v3 -- the React/PatternFly 5 account console that ships as
# the default in Keycloak 26. Deliberately CSS + properties only: no .ftl
# templates are copied, so a Keycloak upgrade cannot leave the console
# rendering against a stale copy of Keycloak's own index.ftl.
parent=keycloak.v3
import=common/keycloak

# Unlike the login theme, `styles` here does not have to restate a parent list.
# keycloak.v3 declares no `styles` of its own -- its bundle reaches the page as
# `entryStyles`, read from the Vite manifest -- and index.ftl emits `entryStyles`
# *before* `styles`. So this is purely additive and ours lands last.
#
# The route chunks are the exception: their stylesheets are injected at runtime,
# after this file. Hence the token-first approach in group-split.css.
styles=css/group-split.css

# The SPA resolves `logo` against the theme's resource URL and falls back to
# Keycloak's own logo.svg when unset.
logo=img/logo.svg
favIcon=/img/logo.svg

title=Account - Group Split
description=Manage your Group Split profile, password and sign-in options.
