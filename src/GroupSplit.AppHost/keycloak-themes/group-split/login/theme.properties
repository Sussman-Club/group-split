# Group Split login theme.
#
# Parents keycloak.v2 (the PatternFly 5 theme that ships as the default in
# Keycloak 26) and layers brand styling on top. Deliberately CSS + message
# overrides only -- no .ftl templates are copied, so Keycloak upgrades cannot
# silently break the login pages against a stale copy of their markup.
parent=keycloak.v2
import=common/keycloak

# `styles` replaces the parent's list rather than appending to it, so the
# parent's own stylesheet has to be repeated here before ours.
styles=css/styles.css css/group-split.css
