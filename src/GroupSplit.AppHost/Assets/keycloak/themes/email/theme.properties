# Group Split email theme.
#
# Parents `keycloak` -- the base email theme that ships with the server -- and
# overrides message bundle entries only. As with the login and account themes no
# .ftl templates are copied, so a Keycloak upgrade cannot leave these mails
# rendering against a stale copy of Keycloak's own markup: the base html/*.ftl
# templates do nothing but emit the matching `...BodyHtml` bundle entry, which is
# where all the branding lives.
parent=keycloak
