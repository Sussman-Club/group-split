# Group Split copy for the mail Keycloak sends.
#
# Only keys that need to sound like the product are listed; everything else falls
# through to the parent theme. Kept ASCII-only so the file reads the same
# regardless of how a given Keycloak build decodes message bundles.
#
# Two constraints shape what can go in here. These values are MessageFormat
# patterns, so a literal apostrophe would have to be doubled -- the copy simply
# avoids them. And the HTML ones are emitted through kcSanitize, which filters
# inline styles against a property whitelist: colours, spacing, borders,
# font-weight, max-width and word-wrap all survive; `display` does not, which is
# why the button is styled as an inline anchor. Every mail also repeats the link
# as text, because a styled anchor is the first thing a strict mail client
# throws away, and that copy sets word-wrap so a signed link cannot run off the
# card.
#
# The colours and the radii are the app's own tokens, spelled out because a mail
# has no stylesheet to read them from: page #f5f0e6, card #fbf8f1 inside
# #e3d9cc, ink #23211d, muted #6b6459, teal #22817a, and the pill the app puts
# its primary actions in. Web fonts do not survive a mail client either, so the
# family names are there for the ones that have Manrope locally and the stack
# falls back cleanly for everyone else.
#
# The {N} arguments are positional and come from the parent theme's templates.
# They are not the same set for every mail: passwordReset and emailVerification
# take {0} link, {1} expiry in minutes, {2} realm name, {3} expiry already
# formatted; executeActions takes {3} as the list of actions being asked for and
# {4} as the formatted expiry.

# --- password reset ---
passwordResetSubject=Reset your Group Split password
passwordResetBody=Someone asked to reset the password on your Group Split account.\n\nIf that was you, choose a new password here:\n{0}\n\nThe link expires in {3}. If you did not ask for this, you can ignore this email and your password stays as it is.
passwordResetBodyHtml=<div style="font-family: Manrope, Helvetica, Arial, sans-serif; background-color: #f5f0e6; padding: 32px;">\
    <div style="max-width: 480px; margin: 0 auto; background-color: #fbf8f1; border: 1px solid #e3d9cc; border-radius: 20px; padding: 32px; color: #23211d;">\
    <h2 style="color: #22817a; font-size: 20px; margin: 0 0 16px;">Group Split</h2>\
    <p style="margin: 0 0 16px;">Someone asked to reset the password on your Group Split account.</p>\
    <p style="margin: 0 0 24px;"><a href="{0}" style="background-color: #22817a; color: #ffffff; font-weight: bold; padding: 12px 22px; border-radius: 999px; text-decoration: none;">Choose a new password</a></p>\
    <p style="margin: 0 0 16px; color: #6b6459;">The link expires in {3}. If you did not ask for this, you can ignore this email and your password stays as it is.</p>\
    <p style="margin: 0; color: #6b6459; word-wrap: break-word;">If the button does not work, paste this into your browser:<br>{0}</p>\
    </div>\
    </div>

# --- email verification ---
emailVerificationSubject=Confirm your Group Split email
emailVerificationBody=Welcome to Group Split. Confirm this email address to finish setting up your account:\n{0}\n\nThe link expires in {3}. If you did not create an account, you can ignore this email.
emailVerificationBodyHtml=<div style="font-family: Manrope, Helvetica, Arial, sans-serif; background-color: #f5f0e6; padding: 32px;">\
    <div style="max-width: 480px; margin: 0 auto; background-color: #fbf8f1; border: 1px solid #e3d9cc; border-radius: 20px; padding: 32px; color: #23211d;">\
    <h2 style="color: #22817a; font-size: 20px; margin: 0 0 16px;">Welcome to Group Split</h2>\
    <p style="margin: 0 0 16px;">Confirm this email address to finish setting up your account.</p>\
    <p style="margin: 0 0 24px;"><a href="{0}" style="background-color: #22817a; color: #ffffff; font-weight: bold; padding: 12px 22px; border-radius: 999px; text-decoration: none;">Confirm my email</a></p>\
    <p style="margin: 0 0 16px; color: #6b6459;">The link expires in {3}. If you did not create an account, you can ignore this email.</p>\
    <p style="margin: 0; color: #6b6459; word-wrap: break-word;">If the button does not work, paste this into your browser:<br>{0}</p>\
    </div>\
    </div>

# --- required actions raised by an administrator ---
executeActionsSubject=Finish setting up your Group Split account
executeActionsBody=There are a few things left to set up on your Group Split account.\n\nFinish them here:\n{0}\n\nThe link expires in {4}. If you were not expecting this, you can ignore this email.
executeActionsBodyHtml=<div style="font-family: Manrope, Helvetica, Arial, sans-serif; background-color: #f5f0e6; padding: 32px;">\
    <div style="max-width: 480px; margin: 0 auto; background-color: #fbf8f1; border: 1px solid #e3d9cc; border-radius: 20px; padding: 32px; color: #23211d;">\
    <h2 style="color: #22817a; font-size: 20px; margin: 0 0 16px;">Group Split</h2>\
    <p style="margin: 0 0 16px;">There are a few things left to set up on your Group Split account.</p>\
    <p style="margin: 0 0 24px;"><a href="{0}" style="background-color: #22817a; color: #ffffff; font-weight: bold; padding: 12px 22px; border-radius: 999px; text-decoration: none;">Finish setting up</a></p>\
    <p style="margin: 0 0 16px; color: #6b6459;">The link expires in {4}. If you were not expecting this, you can ignore this email.</p>\
    <p style="margin: 0; color: #6b6459; word-wrap: break-word;">If the button does not work, paste this into your browser:<br>{0}</p>\
    </div>\
    </div>
