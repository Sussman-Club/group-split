name: Deploy

# Deploys what lands on main, which in practice means a dev -> main merge.
# Targeting the branch rather than the pull_request event means a merge still
# deploys when it is pushed directly or fast-forwarded outside a PR.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time: two concurrent runs would push different image tags into
# the same Komodo stack and race each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      VARS_JSON: ${{ toJSON(vars) }}
      # Lifted to job level because the `secrets` context is not available in a
      # step's `if:`, only in job `env:`. Reading them back as `env` there works.
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          # Credentials. DASHBOARD_TOKEN is what the AppHost publishes the dashboard behind;
          # the publish fails without it, so catch it here before spending a runner on the build.
          for name in KOMODO_URL KOMODO_API_KEY KOMODO_API_SECRET KEYCLOAK_PASSWORD DB_SERVER_PASSWORD DASHBOARD_TOKEN; do
            if [ -z "$(jq -r --arg k "$name" '.[$k] // empty' <<<"$SECRETS_JSON")" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done

          # Non-sensitive deployment config, kept as variables so it stays readable.
          # WEB_HOSTNAME is the stack's single public origin; Keycloak shares it under /idp.
          for name in WEB_HOSTNAME; do
            if [ -z "$(jq -r --arg k "$name" '.[$k] // empty' <<<"$VARS_JSON")" ]; then
              echo "Missing required GitHub variable: ${name}" >&2
              missing=1
            fi
          done

          # Mail and Google sign-in are each switched on by a variable, and then need their
          # credentials. A relay that is on but incomplete is worse than none, because the
          # realm would advertise password reset while every send failed. The AppHost checks
          # the same rules once the parameters are resolved (the validate-smtp and
          # validate-google-sign-in pipeline steps); this copy fails before a runner is spent
          # on the build.
          value() {
            local v
            v="$(jq -r --arg k "$1" '.[$k] // empty' <<<"$VARS_JSON")"
            [ -n "$v" ] || v="$(jq -r --arg k "$1" '.[$k] // empty' <<<"$SECRETS_JSON")"
            printf '%s' "$v"
          }

          # require_when FLAG NAME...: when FLAG is true, every NAME must have a value.
          # Returns 1 when FLAG is not true, so a caller can attach a notice.
          require_when() {
            local flag="$1"
            shift
            [ "$(value "$flag")" = "true" ] || return 1
            for name in "$@"; do
              if [ -z "$(value "$name")" ]; then
                echo "${flag} is true but ${name} is not set" >&2
                missing=1
              fi
            done
          }

          require_when SMTP_ENABLED SMTP_HOST SMTP_FROM SMTP_USER SMTP_PASSWORD \
            || echo "::notice::SMTP_ENABLED is not true. Keycloak will not send password reset or email verification mail."

          require_when GOOGLE_SIGN_IN_ENABLED GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            || echo "::notice::GOOGLE_SIGN_IN_ENABLED is not true. The login page offers no Google button."

          [ "$missing" -eq 0 ] || exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      # Aspire reads deployment parameters from Parameters__<name>. Secret and variable
      # names are SCREAMING_SNAKE, parameter names are kebab-case, so export both
      # spellings and let the ones that match a parameter win. Komodo, registry and
      # GitHub's own entries are excluded: they configure this workflow, not the app.
      - name: Export secrets and variables as Aspire parameters
        shell: bash
        run: |
          set -euo pipefail
          for payload in "$SECRETS_JSON" "$VARS_JSON"; do
            jq -r '
              to_entries[]
              | select(.key | test("^KOMODO_|^GITHUB_|^REGISTRY_") | not)
              | "\(.key)=\(.value)",
                "Parameters__\(.key | ascii_downcase | gsub("_";"-"))=\(.value)"
            ' <<<"$payload" >> "$GITHUB_ENV"
          done

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Show Aspire CLI version
        run: aspire --version

      # Only needed if the registry requires authentication to push. Skipped when the
      # credentials are absent so the workflow works either way.
      - name: Log in to the container registry
        if: ${{ env.REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: registry.sussman.win
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # The api/web images restore inside their own docker build, but the EF
      # migration bundle is generated by msbuild on the runner, so that project
      # needs its assets file here or generating the bundle fails with NETSDK1004.
      # Restored by project, not by solution: the solution also holds the MAUI
      # app, whose android target needs a workload no deploy runner has.
      - name: Restore the migrations project
        run: dotnet restore src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj

      # One invocation, not the Compose prepare step then a push per image: each `aspire do`
      # runs deploy-prereq, which stamps a fresh timestamp tag, so separate calls put
      # the images under tags the generated compose file does not reference. The AppHost
      # declares its Compose prepare step as required by Aspire's `push` entry point
      # (see WithPrepareOnPush), so this documented command yields both the pushed images
      # and the artifacts that reference them, in one pipeline execution sharing a single
      # tag. Deliberately not `aspire deploy`: that would run `docker compose up` on the
      # runner instead of the server.
      - name: Push images and prepare Compose artifacts
        run: aspire do push --environment production --non-interactive

      # Hand the generated compose file and env to Komodo, then deploy the stack.
      # The stack must already exist in Komodo in `file_contents` mode.
      - name: Deploy to Komodo
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          STACK: group-split
        shell: bash
        run: |
          set -euo pipefail
          cd src/GroupSplit.AppHost/aspire-output

          auth=(-H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" -H 'Content-Type: application/json')

          # jq rather than string interpolation: the YAML is full of quotes and newlines.
          jq -n --arg stack "$STACK" \
                --rawfile yaml docker-compose.yaml \
                --rawfile env .env.production '{
            type: "UpdateStack",
            params: { id: $stack,
                      config: { file_contents: $yaml, environment: $env } }
          }' > payload.json
          curl -sf -X POST "$KOMODO_URL/write" "${auth[@]}" --data @payload.json > /dev/null

          # /execute is async: 2xx means accepted, not deployed. Poll the update and
          # fail the job if the deploy itself failed.
          update_id=$(curl -sf -X POST "$KOMODO_URL/execute" "${auth[@]}" \
            -d "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$STACK\"}}" \
            | jq -r '._id."$oid"')

          for _ in $(seq 1 60); do
            sleep 5
            status=$(curl -sf -X POST "$KOMODO_URL/read" "${auth[@]}" \
              -d "{\"type\":\"GetUpdate\",\"params\":{\"id\":\"$update_id\"}}")
            [ "$(jq -r .status <<<"$status")" = "Complete" ] && break
          done

          jq -e '.status == "Complete" and .success == true' <<<"$status" > /dev/null \
            || { echo "Komodo deploy failed:"; jq . <<<"$status"; exit 1; }
