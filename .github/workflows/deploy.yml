name: Deploy

# Merging to main deploys production. The release number is claimed here rather than
# typed by hand: there is no GitHub Release to carry it, so the job derives the next
# app-vMAJOR.MINOR.PATCH from the tags already on the repository and writes its own.
#
# A push is a patch. A minor or major release has to be asked for, which is what the
# manual run is for -- nothing in a commit says "this one is a breaking change".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        default: patch
        options: [patch, minor, major]

# One deploy at a time: two concurrent runs would push different image tags into
# the same Komodo stack and race each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The gate. A reusable-workflow call rather than a workflow_run trigger on purpose:
  # workflow_run would run this file from the default branch and, worse, report the run
  # against that branch -- so the production environment's main-only policy would refuse
  # every deployment. Called this way, the run stays on the pushed ref.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    # Nothing is built, pushed or deployed until every CI job has passed.
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      # Puts the release into the repository's deployment history as a link, so the
      # environment page says where the deployed thing actually is.
      url: ${{ vars.WEB_HOSTNAME }}
    # A backstop: image builds take a couple of minutes and the Komodo poll below is
    # bounded at five, so anything near this is a hang, not a slow run.
    timeout-minutes: 30
    permissions:
      # contents: write is for the app-v tag this job claims for the release it deploys.
      contents: write
      packages: write

    steps:
      # Validation invokes repository scripts, so checkout must come first.
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and every tag: the version below is derived from them.
          fetch-depth: 0
          persist-credentials: false

      # Keep Komodo credentials out of the image-build environment.
      - name: Validate Komodo credentials
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_REGISTRY_ACCOUNT: ${{ vars.KOMODO_REGISTRY_ACCOUNT }}
        shell: bash
        run: bash .github/scripts/validate-komodo-credentials.sh

      # Fails in seconds on a missing value rather than after the images are built.
      # The AppHost enforces the same rules once the parameters are resolved (its
      # validate-smtp and validate-google-sign-in pipeline steps); this copy is the
      # cheap one.
      - name: Validate deployment inputs
        # Reused by validation and release preparation. Komodo credentials and release
        # metadata remain outside this map.
        env: &deployment_inputs
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          DB_SERVER_PASSWORD: ${{ secrets.DB_SERVER_PASSWORD }}
          KEYCLOAK_PASSWORD: ${{ secrets.KEYCLOAK_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ vars.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          # The account-deletion client's secret. The realm worker creates the client and
          # holds it to this value on every deploy, so rotating it is changing this secret.
          KEYCLOAK_ACCOUNT_DELETION_SECRET: ${{ secrets.KEYCLOAK_ACCOUNT_DELETION_SECRET }}
          CACHE_PASSWORD: ${{ secrets.CACHE_PASSWORD }}
          # Pinned for the same reason as the two passwords above: left to Aspire, the
          # RustFS keys are regenerated on every publish, so the storage container is
          # recreated with new root credentials on every deploy.
          STORAGE_ACCESSKEY: ${{ secrets.STORAGE_ACCESSKEY }}
          STORAGE_SECRETKEY: ${{ secrets.STORAGE_SECRETKEY }}
          SMTP_ENABLED: ${{ vars.SMTP_ENABLED }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          # Resend supports 587 for STARTTLS, which is the mode configured in realms.json.
          # A production override remains possible through the environment variable.
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_SIGN_IN_ENABLED: ${{ vars.GOOGLE_SIGN_IN_ENABLED }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PLAID_ENABLED: ${{ vars.PLAID_ENABLED }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ vars.PLAID_ENV }}
          PLAID_REDIRECT_URI: ${{ vars.PLAID_REDIRECT_URI }}
          BANK_KEY_CERTIFICATE: ${{ secrets.BANK_KEY_CERTIFICATE }}
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED || 'false' }}
          PUSH_PROJECT_ID: ${{ vars.PUSH_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          RECEIPT_TRANSCRIPTION_PROVIDER: ${{ secrets.RECEIPT_TRANSCRIPTION_PROVIDER }}
          VERYFI_ENABLED: ${{ vars.VERYFI_ENABLED }}
          VERYFI_CLIENT_ID: ${{ secrets.VERYFI_CLIENT_ID }}
          VERYFI_USERNAME: ${{ secrets.VERYFI_USERNAME }}
          VERYFI_API_KEY: ${{ secrets.VERYFI_API_KEY }}
          VERYFI_LOG_RAW_RESPONSES: ${{ vars.VERYFI_LOG_RAW_RESPONSES || 'false' }}
          AZURE_OPENAI_ENABLED: ${{ vars.AZURE_OPENAI_ENABLED }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DECISION_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DECISION_DEPLOYMENT }}
        shell: bash
        run: bash .github/scripts/validate-deployment-inputs.sh

      # The release script reuses an existing tag on HEAD when a workflow is rerun.
      - name: Claim the release version
        id: deployment
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash .github/scripts/claim-release-version.sh

      - name: Read the Aspire CLI version from the AppHost
        id: aspire
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/get-aspire-apphost-sdk-version.sh)"
          echo "Using Aspire CLI $version from the AppHost SDK."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The NuGet global tool rather than the install script, using the version declared
      # by the AppHost SDK. This keeps the CLI and evaluated application model aligned
      # when the AppHost is upgraded.
      - name: Install the Aspire CLI
        env:
          ASPIRE_CLI_VERSION: ${{ steps.aspire.outputs.version }}
        run: |
          dotnet tool install -g Aspire.Cli --version "$ASPIRE_CLI_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Show Aspire CLI version
        run: aspire --version

      # GHCR requires auth even to push to your own namespace. The automatic
      # GITHUB_TOKEN can write packages under this repo's owner (the org) and
      # nowhere else, which is the scope wanted here: no stored secret to rotate.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The api/web images restore inside their own docker build, but the EF
      # migration bundle is generated by msbuild on the runner, so that project
      # needs its assets file here or generating the bundle fails with NETSDK1004.
      # Restored by project, not by solution: the solution also holds the MAUI
      # app, whose android target needs a workload no deploy runner has.
      - name: Restore the migrations project
        run: dotnet restore src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj

      # Build, push, and prepare in one AppHost run. Komodo, not the runner, runs Compose.
      - name: Prepare and push Compose release
        env: *deployment_inputs
        shell: bash
        run: bash .github/scripts/prepare-compose-release.sh

      - name: Validate generated Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --file src/GroupSplit.AppHost/aspire-output/docker-compose.yaml \
            --env-file src/GroupSplit.AppHost/aspire-output/.env.production \
            config --quiet

      # The Compose file is what the host will run, kept with the run for a month so a
      # deploy can be inspected after the fact. Only the Compose file: the env file next
      # to it holds every secret in the clear, and artifacts are readable by anyone with
      # read access to the repository.
      - name: Keep the generated Compose file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-compose
          path: |
            src/GroupSplit.AppHost/aspire-output/docker-compose.yaml
            src/GroupSplit.AppHost/aspire-output/deployment-manifest.txt
          if-no-files-found: ignore
          retention-days: 30

      # The stack already exists in Komodo in `file_contents` mode. The script saves its
      # current configuration for rollback.
      - name: Deploy to Komodo
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          # Komodo registry account with read access to this organisation's GHCR packages.
          KOMODO_REGISTRY_ACCOUNT: ${{ vars.KOMODO_REGISTRY_ACCOUNT }}
          STACK: ${{ vars.KOMODO_STACK || 'group-split' }}
        shell: bash
        run: bash .github/scripts/deploy-komodo-stack.sh

      # Komodo's completed update confirms that the stack operation finished, but it does
      # not prove that the public proxy and identity issuer are serving the new release.
      # These checks exercise both the application origin and the Keycloak path that the
      # web app uses for OIDC discovery.
      - name: Smoke-test the deployed endpoints
        env:
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          origin="${WEB_HOSTNAME%/}"
          curl_args=(--fail-with-body --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30)

          curl "${curl_args[@]}" "$origin/" > /dev/null
          oidc_metadata=$(curl "${curl_args[@]}" "$origin/idp/realms/group-split/.well-known/openid-configuration")
          jq -e --arg expected "$origin/idp/realms/group-split" '.issuer == $expected' <<<"$oidc_metadata" > /dev/null

          echo "Public web and OIDC discovery endpoints are healthy."
