name: Deploy

# Merging to main deploys production. The release number is claimed here rather than
# typed by hand: there is no GitHub Release to carry it, so the job derives the next
# app-vMAJOR.MINOR.PATCH from the tags already on the repository and writes its own.
#
# A push is a patch. A minor or major release has to be asked for, which is what the
# manual run is for -- nothing in a commit says "this one is a breaking change".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        default: patch
        options: [patch, minor, major]

# One deploy at a time: two concurrent runs would push different image tags into
# the same Komodo stack and race each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The gate. A reusable-workflow call rather than a workflow_run trigger on purpose:
  # workflow_run would run this file from the default branch and, worse, report the run
  # against that branch -- so the production environment's main-only policy would refuse
  # every deployment. Called this way, the run stays on the pushed ref.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    # Nothing is built, pushed or deployed until every CI job has passed.
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      # Puts the release into the repository's deployment history as a link, so the
      # environment page says where the deployed thing actually is.
      url: ${{ vars.WEB_HOSTNAME }}
    # A backstop: image builds take a couple of minutes and the Komodo poll below is
    # bounded at five, so anything near this is a hang, not a slow run.
    timeout-minutes: 30
    permissions:
      # contents: write is for the app-v tag this job claims for the release it deploys.
      contents: write
      packages: write

    steps:
      # Separate from the parameter check below so the Komodo credentials stay scoped to
      # the two steps that actually talk to Komodo, instead of riding along with every
      # parameter through the image build.
      - name: Validate Komodo credentials
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in KOMODO_URL KOMODO_API_KEY KOMODO_API_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is not set on the production environment" >&2
              missing=1
            fi
          done

          [ "$missing" -eq 0 ]

      # Fails in seconds on a missing value rather than after the images are built.
      # The AppHost enforces the same rules once the parameters are resolved (its
      # validate-smtp and validate-google-sign-in pipeline steps); this copy is the
      # cheap one.
      - name: Validate deployment inputs
        # Anchored so the push step reuses exactly this allowlist. Actions supports YAML
        # anchors and aliases but not merge keys, so both uses have to be the same map --
        # which is why the Komodo credentials above and the release version below are
        # deliberately not part of it.
        env: &deployment_inputs
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          DB_SERVER_PASSWORD: ${{ secrets.DB_SERVER_PASSWORD }}
          KEYCLOAK_PASSWORD: ${{ secrets.KEYCLOAK_PASSWORD }}
          CACHE_PASSWORD: ${{ secrets.CACHE_PASSWORD }}
          SMTP_ENABLED: ${{ vars.SMTP_ENABLED }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          # Resend supports 587 for STARTTLS, which is the mode configured in realms.json.
          # A production override remains possible through the environment variable.
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_SIGN_IN_ENABLED: ${{ vars.GOOGLE_SIGN_IN_ENABLED }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PLAID_ENABLED: ${{ vars.PLAID_ENABLED }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ vars.PLAID_ENV }}
          PLAID_REDIRECT_URI: ${{ vars.PLAID_REDIRECT_URI }}
          BANK_KEY_CERTIFICATE: ${{ secrets.BANK_KEY_CERTIFICATE }}
          RECEIPT_TRANSCRIPTION_PROVIDER: ${{ secrets.RECEIPT_TRANSCRIPTION_PROVIDER }}
          VERYFI_ENABLED: ${{ vars.VERYFI_ENABLED }}
          VERYFI_CLIENT_ID: ${{ secrets.VERYFI_CLIENT_ID }}
          VERYFI_USERNAME: ${{ secrets.VERYFI_USERNAME }}
          VERYFI_API_KEY: ${{ secrets.VERYFI_API_KEY }}
          VERYFI_LOG_RAW_RESPONSES: ${{ vars.VERYFI_LOG_RAW_RESPONSES || 'false' }}
          AZURE_OPENAI_ENABLED: ${{ vars.AZURE_OPENAI_ENABLED }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          # value NAME: reads an explicitly allowlisted workflow input. Keeping this
          # list here prevents a future, unrelated GitHub secret from being forwarded
          # into the AppHost and the generated deployment environment.
          value() {
            printf '%s' "${!1:-}"
          }

          # require NAME...: every NAME must have a value.
          require() {
            for name in "$@"; do
              if [ -z "$(value "$name")" ]; then
                echo "${name} is not set on the production environment" >&2
                missing=1
              fi
            done
          }

          # require_when FLAG NAME...: when FLAG is true, every NAME must have a value.
          require_when() {
            local flag="$1"
            shift
            [ "$(value "$flag")" = "true" ] || return 1
            require "$@"
          }

          require WEB_HOSTNAME DASHBOARD_TOKEN DB_SERVER_PASSWORD KEYCLOAK_PASSWORD \
                  CACHE_PASSWORD

          require_when SMTP_ENABLED SMTP_HOST SMTP_FROM SMTP_USER SMTP_PASSWORD \
            || echo "::notice::SMTP_ENABLED is not true. Keycloak will not send password reset or email verification mail."
          require_when GOOGLE_SIGN_IN_ENABLED GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            || echo "::notice::GOOGLE_SIGN_IN_ENABLED is not true. The login page offers no Google button."
          require_when PLAID_ENABLED PLAID_CLIENT_ID PLAID_SECRET \
            || echo "::notice::PLAID_ENABLED is not true. Nobody can link a bank."
          require_when VERYFI_ENABLED VERYFI_CLIENT_ID VERYFI_USERNAME VERYFI_API_KEY \
            || echo "::notice::VERYFI_ENABLED is not true. Receipt transcription through Veryfi is off."

          # Cross-field validation still fails closed: a provider selected explicitly must
          # also be enabled, and an enabled provider must have its complete credentials.
          provider="$(value RECEIPT_TRANSCRIPTION_PROVIDER)"
          case "$provider" in
            AzureOpenAI)
              require_when AZURE_OPENAI_ENABLED AZURE_OPENAI_ENDPOINT AZURE_OPENAI_MODEL AZURE_OPENAI_API_KEY \
                || echo "::notice::AZURE_OPENAI_ENABLED is not true. Azure OpenAI receipt transcription is off."
              ;;
            Veryfi|'') ;;
            *)
              echo "RECEIPT_TRANSCRIPTION_PROVIDER must be Veryfi or AzureOpenAI, not '$provider'" >&2
              missing=1
              ;;
          esac

          [ "$missing" -eq 0 ] || exit 1

      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and every tag: the version below is derived from them.
          fetch-depth: 0
          persist-credentials: false

      # Claims the next app-v version and writes the tag, so the images, the Compose file
      # and the deployment record all name one immutable identifier. Modelled on the CLI's
      # release job, including reusing a tag already on HEAD: that is what makes a re-run
      # of this workflow deploy the same version rather than burning a new number.
      - name: Claim the release version
        id: deployment
        env:
          # Through the environment, not interpolated: `${{ }}` is pasted in before bash
          # parses the line.
          BUMP: ${{ inputs.bump || 'patch' }}
          # Creating the tag through the API keeps the git credential off the checkout, so
          # nothing later in the job inherits push rights.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"

          # A re-run finds its own tag and deploys that version again.
          existing="$(git tag --points-at HEAD --list 'app-v*' | head -1)"
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing; deploying that version again."
            version="$existing"
          else
            latest="$(git tag --list 'app-v*' --sort=-v:refname | head -1)"

            if [ -z "$latest" ]; then
              version="app-v0.1.0"
            else
              IFS=. read -r major minor patch <<<"${latest#app-v}"

              case "$BUMP" in
                major) version="app-v$((major + 1)).0.0" ;;
                minor) version="app-v${major}.$((minor + 1)).0" ;;
                patch) version="app-v${major}.${minor}.$((patch + 1))" ;;
                *) echo "::error::Unknown bump '$BUMP'." >&2; exit 1 ;;
              esac
            fi

            echo "Last release: ${latest:-none}. Claiming $version ($BUMP) for $commit."
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$version" -f "sha=$commit" > /dev/null
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          # Also onto the job environment: the push step reuses the anchored parameter
          # map, and an alias cannot carry a step output of its own.
          echo "DEPLOYMENT_VERSION=$version" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Deployment__Version=$version" >> "$GITHUB_ENV"

      - name: Read the Aspire CLI version from the AppHost
        id: aspire
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/get-aspire-apphost-sdk-version.sh)"
          echo "Using Aspire CLI $version from the AppHost SDK."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The NuGet global tool rather than the install script, using the version declared
      # by the AppHost SDK. This keeps the CLI and evaluated application model aligned
      # when the AppHost is upgraded.
      - name: Install the Aspire CLI
        env:
          ASPIRE_CLI_VERSION: ${{ steps.aspire.outputs.version }}
        run: |
          dotnet tool install -g Aspire.Cli --version "$ASPIRE_CLI_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Show Aspire CLI version
        run: aspire --version

      # GHCR requires auth even to push to your own namespace. The automatic
      # GITHUB_TOKEN can write packages under this repo's owner (the org) and
      # nowhere else, which is the scope wanted here: no stored secret to rotate.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The api/web images restore inside their own docker build, but the EF
      # migration bundle is generated by msbuild on the runner, so that project
      # needs its assets file here or generating the bundle fails with NETSDK1004.
      # Restored by project, not by solution: the solution also holds the MAUI
      # app, whose android target needs a workload no deploy runner has.
      - name: Restore the migrations project
        run: dotnet restore src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj

      # One invocation, not the Compose prepare step then a push per image: the AppHost
      # declares its Compose prepare step as required by Aspire's `push` entry point
      # (see WithPrepareOnPush), so this documented command yields both the pushed images
      # and the artifacts that reference the same release tag. Deliberately not `aspire
      # deploy`: that would run `docker compose up` on the runner instead of the server.
      - name: Push images and prepare Compose artifacts
        env: *deployment_inputs
        shell: bash
        run: |
          set -euo pipefail

          # The allowlist, and the only place these names are written in this step. Every
          # AppHost parameter is the lower-cased GitHub name, so the mapping is mechanical:
          # DASHBOARD_TOKEN becomes Parameters__dashboard_token, the spelling Aspire
          # documents for CI (a dash in a parameter name written as an underscore).
          #
          # A list rather than the whole environment is what stops a future, unrelated
          # repository secret from reaching the AppHost and the generated deployment
          # environment.
          parameters="
            WEB_HOSTNAME DASHBOARD_TOKEN DB_SERVER_PASSWORD KEYCLOAK_PASSWORD CACHE_PASSWORD
            SMTP_ENABLED SMTP_HOST SMTP_PORT SMTP_FROM SMTP_USER SMTP_PASSWORD
            GOOGLE_SIGN_IN_ENABLED GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
            PLAID_ENABLED PLAID_CLIENT_ID PLAID_SECRET PLAID_ENV PLAID_REDIRECT_URI
            BANK_KEY_CERTIFICATE
            RECEIPT_TRANSCRIPTION_PROVIDER
            VERYFI_ENABLED VERYFI_CLIENT_ID VERYFI_USERNAME VERYFI_API_KEY
            VERYFI_LOG_RAW_RESPONSES
            AZURE_OPENAI_ENABLED AZURE_OPENAI_ENDPOINT AZURE_OPENAI_MODEL AZURE_OPENAI_API_KEY
          "

          for name in $parameters; do
            value="${!name:-}"

            if [ -n "$value" ]; then
              export "Parameters__$(printf %s "$name" | tr "[:upper:]" "[:lower:]")=$value"
            fi

            # Do not leave the GitHub-facing name in the environment the build inherits.
            unset "$name"
          done

          aspire do push --environment production --non-interactive

          # Aspire writes release tags into the generated environment file. Resolve each
          # pushed tag to its registry digest so the remote host pulls the exact content
          # that CI built, rather than a tag that could later be moved.
          output_dir="src/GroupSplit.AppHost/aspire-output"
          env_file="$output_dir/.env.production"
          image_variables=(API_IMAGE WEB_IMAGE MIGRATIONS_INTERNAL_IMAGE REALM_SETTINGS_IMAGE)
          declare -A tagged_images
          declare -A pinned_images

          env_value() {
            local key="$1"
            local value
            value="$(awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' "$env_file")"
            [ -n "$value" ] || {
              echo "Generated environment is missing $key." >&2
              exit 1
            }
            printf '%s' "$value"
          }

          replace_env_value() {
            local key="$1"
            local value="$2"
            local temporary
            temporary="$(mktemp)"
            awk -v key="$key" -v value="$value" '
              index($0, key "=") == 1 { print key "=" value; found=1; next }
              { print }
              END { if (!found) exit 1 }
            ' "$env_file" > "$temporary"
            mv "$temporary" "$env_file"
          }

          for image_variable in "${image_variables[@]}"; do
            tagged_images["$image_variable"]="$(env_value "$image_variable")"
            repository="${tagged_images[$image_variable]%:*}"
            pinned_images["$image_variable"]="$(docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "${tagged_images[$image_variable]}" \
              | awk -v prefix="${repository}@sha256:" 'index($0, prefix) == 1 {print; exit}' || true)"
            [ -n "${pinned_images[$image_variable]}" ] || {
              echo "Could not resolve a registry digest for ${tagged_images[$image_variable]}." >&2
              exit 1
            }
            replace_env_value "$image_variable" "${pinned_images[$image_variable]}"
          done

          # Keep an auditable, secret-free record of exactly what this run pushed. The
          # resolved .env.production remains on the runner only because it contains the
          # deployment secrets.
          {
            echo "deployment_version=$DEPLOYMENT_VERSION"
            echo "commit=$DEPLOYMENT_COMMIT"
            echo "environment=production"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for image_variable in "${image_variables[@]}"; do
              image_name="${image_variable%_IMAGE}"
              image_name="${image_name,,}"
              echo "image.${image_name}.tag=${tagged_images[$image_variable]}"
              echo "image.${image_name}.digest=${pinned_images[$image_variable]#*@}"
              echo "image.${image_name}.reference=${pinned_images[$image_variable]}"
            done
          } > "$output_dir/deployment-manifest.txt"

      - name: Validate generated Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --file src/GroupSplit.AppHost/aspire-output/docker-compose.yaml \
            --env-file src/GroupSplit.AppHost/aspire-output/.env.production \
            config --quiet

      # The Compose file is what the host will run, kept with the run for a month so a
      # deploy can be inspected after the fact. Only the Compose file: the env file next
      # to it holds every secret in the clear, and artifacts are readable by anyone with
      # read access to the repository.
      - name: Keep the generated Compose file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-compose
          path: |
            src/GroupSplit.AppHost/aspire-output/docker-compose.yaml
            src/GroupSplit.AppHost/aspire-output/deployment-manifest.txt
          if-no-files-found: ignore
          retention-days: 30

      # Hand the generated compose file and env to Komodo, then deploy the stack.
      # The stack must already exist in Komodo in `file_contents` mode.
      #
      # A deploy that fails puts the previous stack configuration back and deploys it again.
      # Compose recreates the api and web containers before it finds out that a one-shot
      # service they wait for has failed, so a failed deploy is not a no-op: left alone, it
      # keeps the site down until something else is deployed.
      - name: Deploy to Komodo
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          STACK: group-split
        shell: bash
        run: |
          set -euo pipefail
          cd src/GroupSplit.AppHost/aspire-output
          # The environment file and request payloads contain production secrets. Remove
          # them before action post-steps execute, even if Komodo rejects the update.
          trap 'rm -f payload.json previous.json rollback.json .env.production' EXIT

          # Mask the generated secrets before anything below can print them. GitHub masks
          # only its own secrets; values Aspire generates -- the storage keys, say -- would
          # reach the log in the clear through any Compose output that echoes them.
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            value="${value#\"}"
            value="${value%\"}"
            if [[ "${key^^}" =~ PASSWORD|SECRET|KEY|TOKEN|CERT ]] && [ "${#value}" -ge 4 ]; then
              echo "::add-mask::$value"
            fi
          done < .env.production

          auth=(-H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" -H 'Content-Type: application/json')
          # Safe to retry: UpdateStack is an upsert, and GetStack, GetUpdate and GetStackLog are reads.
          curl_args=(--fail-with-body --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60)

          # DeployStack is not. A retry after a lost or slow response would start a second
          # deploy of the same stack -- the very thing the job concurrency group exists to
          # prevent, from inside a single run. One attempt, with room to be accepted.
          execute_args=(--fail-with-body --silent --show-error --connect-timeout 10 --max-time 120)

          # Deploys whatever configuration the stack holds, and prints the update's id.
          deploy() {
            local response id
            response=$(curl "${execute_args[@]}" -X POST "$KOMODO_URL/execute" "${auth[@]}" \
              -d "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$STACK\"}}")
            id=$(jq -r '._id."$oid" // empty' <<<"$response")
            if [ -z "$id" ]; then
              echo "Komodo did not return an update id." >&2
              return 1
            fi
            printf '%s' "$id"
          }

          # /execute is async: 2xx means accepted, not deployed. Polls the update into $status.
          #
          # Still running after five minutes has not failed, and calling it a failure sends
          # whoever reads this looking for the wrong thing: it is most likely still going on
          # the host, with the stack mid-change. Nor is it rolled back, which would race it.
          wait_for() {
            local id="$1" state=''
            for _ in $(seq 1 60); do
              sleep 5
              status=$(curl "${curl_args[@]}" -X POST "$KOMODO_URL/read" "${auth[@]}" \
                -d "{\"type\":\"GetUpdate\",\"params\":{\"id\":\"$id\"}}")
              state="$(jq -r '.status // empty' <<<"$status")"
              [ "$state" = "Complete" ] && return 0
            done
            echo "::error::Komodo update $id was still '${state:-unknown}' after five minutes. It is probably still running on the host; check the stack there before retrying, because a second deploy would race it."
            return 1
          }

          # Says why the update in $status failed: the failed stages, and only their stderr,
          # since the Compose Config stage's stdout is the fully interpolated Compose file. A
          # one-shot service that exited non-zero -- the realm worker, the migrations -- is
          # named there but not explained, so its own log is fetched as well; otherwise the
          # reason stays on the host.
          report_failure() {
            local service
            jq -r '(.logs // [])[] | select(.success == false) | "--- \(.stage): \(.command)\n\(.stderr)"' <<<"$status"
            for service in $(jq -r '[(.logs // [])[] | select(.success == false) | .stderr
                                     | scan("service \"([^\"]+)\" didn.t complete successfully") | .[0]]
                                    | unique | .[]' <<<"$status"); do
              echo "::group::Log of $service"
              curl "${curl_args[@]}" -X POST "$KOMODO_URL/read" "${auth[@]}" \
                -d "{\"type\":\"GetStackLog\",\"params\":{\"stack\":\"$STACK\",\"services\":[\"$service\"],\"tail\":200}}" \
                | jq -r '.stdout, .stderr' \
                || echo "Could not read the log of $service from Komodo."
              echo "::endgroup::"
              echo "::error::Service $service did not complete successfully; its log is in the group above."
            done
          }

          # What production runs now, kept to put back if this deploy fails. Without it there
          # is nothing to roll back to, and the deploy goes ahead as it always did.
          if curl "${curl_args[@]}" -X POST "$KOMODO_URL/read" "${auth[@]}" \
               -d "{\"type\":\"GetStack\",\"params\":{\"stack\":\"$STACK\"}}" > previous.json \
             && jq -e '(.config.file_contents // "") != "" and (.config.environment // "") != ""' previous.json > /dev/null; then
            jq --arg stack "$STACK" '{
              type: "UpdateStack",
              params: { id: $stack,
                        config: { file_contents: .config.file_contents, environment: .config.environment,
                                  registry_provider: .config.registry_provider,
                                  registry_account: .config.registry_account } }
            }' previous.json > rollback.json
          else
            echo "::warning::Could not read the current configuration of stack $STACK, so a failed deploy will not be rolled back."
          fi
          rm -f previous.json

          # jq rather than string interpolation: the YAML is full of quotes and newlines.
          jq -n --arg stack "$STACK" \
                --rawfile yaml docker-compose.yaml \
                --rawfile env .env.production '{
            type: "UpdateStack",
            params: { id: $stack,
                      config: { file_contents: $yaml, environment: $env,
                                # Komodo logs in to GHCR before compose up, with the
                                # read-only account stored in its config.
                                registry_provider: "ghcr.io",
                                registry_account: "lorainemg" } }
          }' > payload.json
          curl "${curl_args[@]}" -X POST "$KOMODO_URL/write" "${auth[@]}" --data @payload.json > /dev/null

          status=''
          update_id=$(deploy)
          wait_for "$update_id"

          if ! jq -e '.success == true' <<<"$status" > /dev/null; then
            echo "::error::Komodo deploy failed for update $update_id."
            report_failure

            [ -f rollback.json ] || exit 1

            echo "Restoring the previous configuration of stack $STACK and deploying it again."
            curl "${curl_args[@]}" -X POST "$KOMODO_URL/write" "${auth[@]}" --data @rollback.json > /dev/null
            rollback_id=$(deploy)
            wait_for "$rollback_id"

            if jq -e '.success == true' <<<"$status" > /dev/null; then
              echo "::error::Rolled back: production runs the previous stack configuration again (Komodo update $rollback_id)."
              outcome="rolled back to the previous configuration (\`$rollback_id\`)"
            else
              echo "::error::The rollback failed as well (Komodo update $rollback_id), so production is probably down."
              report_failure
              outcome="failed, and so did the rollback (\`$rollback_id\`)"
            fi

            {
              echo "### Deployment failed"
              echo
              echo "- Release: \`$DEPLOYMENT_VERSION\`"
              echo "- Commit: \`$DEPLOYMENT_COMMIT\`"
              echo "- Komodo update: \`$update_id\`"
              echo "- Outcome: $outcome"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Deployment"
            echo
            echo "- Release: \`$DEPLOYMENT_VERSION\`"
            echo "- Commit: \`$DEPLOYMENT_COMMIT\`"
            echo "- Komodo update: \`$update_id\`"
            echo "- Environment: \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Komodo's completed update confirms that the stack operation finished, but it does
      # not prove that the public proxy and identity issuer are serving the new release.
      # These checks exercise both the application origin and the Keycloak path that the
      # web app uses for OIDC discovery.
      - name: Smoke-test the deployed endpoints
        env:
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME || secrets.WEB_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          origin="${WEB_HOSTNAME%/}"
          curl_args=(--fail-with-body --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30)

          curl "${curl_args[@]}" "$origin/" > /dev/null
          oidc_metadata=$(curl "${curl_args[@]}" "$origin/idp/realms/group-split/.well-known/openid-configuration")
          jq -e --arg expected "$origin/idp/realms/group-split" '.issuer == $expected' <<<"$oidc_metadata" > /dev/null

          echo "Public web and OIDC discovery endpoints are healthy."
