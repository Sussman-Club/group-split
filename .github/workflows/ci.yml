name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

# A new push to a PR supersedes the run already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The share of hand-written lines and branches the unit tests must keep
      # covered. Set to what was measured the day the gate went in, so it is a
      # ratchet against regression rather than a target: raise it when coverage
      # improves, and never lower it to turn a red build green.
      #
      # Turned up twice on this branch. First for the debt, rules, validation, middleware
      # and transaction-detail tests, then again once the endpoints were reachable at all:
      # 45.92/33.40 line/branch at the start, 69.5/58.0 now. The floors keep the few points
      # of slack the original pair had, so an unrelated change in what the in-memory
      # provider happens to execute cannot fail a build on its own.
      COVERAGE_LINE_FLOOR: 65
      COVERAGE_BRANCH_FLOOR: 54

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # GroupSplit.App (the MAUI head) targets android/ios/maccatalyst and is
      # deliberately excluded -- those need workloads, and ios/maccatalyst need
      # macOS. The AppHost reaches the MAUI and migrations projects by path
      # rather than ProjectReference, so neither is pulled in transitively:
      # migrations is listed explicitly, MAUI is left to a future macOS job.
      - name: Restore
        run: |
          dotnet restore tests/GroupSplit.API.Test/GroupSplit.API.Test.csproj
          dotnet restore tests/GroupSplit.App.Web.Test/GroupSplit.App.Web.Test.csproj
          dotnet restore tests/GroupSplit.Seeder.Test/GroupSplit.Seeder.Test.csproj
          dotnet restore src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj

      - name: Build
        run: |
          dotnet build tests/GroupSplit.API.Test/GroupSplit.API.Test.csproj -c Release --no-restore
          dotnet build tests/GroupSplit.App.Web.Test/GroupSplit.App.Web.Test.csproj -c Release --no-restore
          dotnet build tests/GroupSplit.Seeder.Test/GroupSplit.Seeder.Test.csproj -c Release --no-restore
          dotnet build src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj -c Release --no-restore

      # Everything above is Release, but `aspire do` builds Debug, so the deploy
      # workflow was the only thing exercising that configuration -- and some of it
      # is Debug-only. Hot-reload assets are the case that got through: they are
      # absent from a Release build, so a duplicate one in the WASM boot config
      # manifest failed GenerateWasmBootJson at deploy time and nowhere earlier.
      #
      # The web app pulls the WASM client, which is where that generation happens.
      # Build rather than publish: it covers the same targets in seconds, and the
      # deploy exercises publish itself.
      - name: Build the deploy configuration
        run: dotnet build src/GroupSplit.App/GroupSplit.App.Web/GroupSplit.App.Web.csproj -c Debug --no-restore

      # GroupSplit.AppHost.Test is neither built nor run here. It has the `integration`
      # job below, which is the only place carrying the Docker and Playwright setup it
      # needs, so building it twice would buy nothing.
      - name: Test
        run: |
          # --results-directory stays ahead of the `--`: past it the CLI resolves the
          # value against the filesystem and rejects it as a positional path once the
          # directory exists, so the second invocation would fail where the first passed.
          dotnet test --project tests/GroupSplit.API.Test/GroupSplit.API.Test.csproj \
            -c Release --no-build --results-directory TestResults \
            -- --report-trx --report-trx-filename api-tests.trx \
               --coverage --coverage-settings tests/coverage.config \
               --coverage-output-format cobertura --coverage-output api.cobertura.xml
          dotnet test --project tests/GroupSplit.App.Web.Test/GroupSplit.App.Web.Test.csproj \
            -c Release --no-build --results-directory TestResults \
            -- --report-trx --report-trx-filename app-web-tests.trx \
               --coverage --coverage-settings tests/coverage.config \
               --coverage-output-format cobertura --coverage-output app-web.cobertura.xml
          dotnet test --project tests/GroupSplit.Seeder.Test/GroupSplit.Seeder.Test.csproj \
            -c Release --no-build --results-directory TestResults \
            -- --report-trx --report-trx-filename seeder-tests.trx \
               --coverage --coverage-settings tests/coverage.config \
               --coverage-output-format cobertura --coverage-output seeder.cobertura.xml

      # Merges the per-project Cobertura files into one report and renders the
      # summary onto the run's own page, so a reviewer sees the numbers without
      # downloading an artifact first.
      - name: Report coverage
        if: always()
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:'TestResults/*.cobertura.xml' \
            -targetdir:TestResults/coverage \
            -reporttypes:'Cobertura;Html;MarkdownSummaryGithub'
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Quietly covering less than it used to is the failure coverage exists to
      # catch, so this gates the build rather than only reporting.
      - name: Enforce the coverage floor
        if: always()
        run: |
          python3 tests/coverage-gate.py TestResults/coverage/Cobertura.xml \
            "$COVERAGE_LINE_FLOOR" "$COVERAGE_BRANCH_FLOOR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  integration:
    name: Integration tests (Aspire)
    runs-on: ubuntu-latest

    # These bring the stack up under Aspire's testing host -- Postgres, Keycloak, the
    # API, the web app -- and drive it with Playwright. They are the only thing in CI
    # that touches the real database provider, the container wiring and a rendered
    # page, so without them nothing tells us the infrastructure still works until a
    # deploy does.
    #
    # A backstop only. The suite bounds its own waits (see AppHostFixture), so a stall
    # should fail with the resource states rather than run out the clock; this is here
    # so that a hang somewhere those timeouts do not reach cannot hold a runner for the
    # six-hour default. Locally the whole run takes about 40 seconds once images are
    # cached, so the budget is almost entirely image pulls on a cold runner.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore tests/GroupSplit.AppHost.Test/GroupSplit.AppHost.Test.csproj
          dotnet restore src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj

      - name: Build
        run: |
          dotnet build tests/GroupSplit.AppHost.Test/GroupSplit.AppHost.Test.csproj -c Release --no-restore
          dotnet build src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj -c Release --no-restore

      # Playwright ships its browsers separately from the NuGet package; the install
      # script is written into the test project's build output.
      - name: Install Playwright browsers
        run: pwsh tests/GroupSplit.AppHost.Test/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The tests navigate to the web app's HTTPS endpoint, so both Chromium and the
      # .NET side of the stack have to trust the ASP.NET Core development certificate.
      # That trust is what the job was pulled over: it is present on a developer machine
      # and absent on a runner, and Chromium refused the endpoint with
      # ERR_CERT_AUTHORITY_INVALID before any assertion ran.
      #
      # Pinned to the Aspire version the projects reference, so the CLI and the AppHost
      # SDK agree. `dotnet tool install` puts it in ~/.dotnet/tools.
      - name: Install the Aspire CLI
        run: |
          dotnet tool install -g Aspire.Cli --version 13.5.3
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # `aspire certs trust` trusts the certificate for OpenSSL *and* for browsers, but
      # the browser half goes through certutil against Chromium's NSS database, and
      # neither the tool nor the database is present on a fresh runner. Both have to
      # exist before the trust step or that half silently does nothing -- on a
      # non-interactive Linux run Aspire treats a partially trusted certificate as
      # success rather than a failure, so it would not tell us.
      - name: Prepare Chromium's certificate store
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password || true

      # SSL_CERT_DIR is how the .NET processes under test find the certificate: on Linux
      # `dotnet dev-certs` exports it to ~/.aspnet/dev-certs/trust, and OpenSSL only
      # looks there when the variable says to. Without it the AppHost's own health
      # checks reject the endpoints they probe. The system directory is kept so the
      # runner's normal roots still resolve.
      - name: Trust the development certificate
        run: |
          set -euo pipefail
          aspire certs trust --non-interactive
          echo "SSL_CERT_DIR=/etc/ssl/certs:$HOME/.aspnet/dev-certs/trust" >> "$GITHUB_ENV"

      # Aspire reports partial trust as success, so this is the step that actually says
      # whether Chromium will accept the endpoint. Failing here points at the
      # certificate rather than letting the suite fail later as a browser error.
      - name: Verify Chromium trusts the certificate
        run: |
          set -euo pipefail
          certutil -d "sql:$HOME/.pki/nssdb" -L
          if ! certutil -d "sql:$HOME/.pki/nssdb" -L | grep -qi 'localhost\|ASP.NET'; then
            echo "::error::The dev certificate is not in Chromium's NSS database; the Playwright tests would fail with ERR_CERT_AUTHORITY_INVALID."
            exit 1
          fi

      - name: Test
        run: |
          dotnet test --project tests/GroupSplit.AppHost.Test/GroupSplit.AppHost.Test.csproj \
            -c Release --no-build --results-directory TestResults \
            -- --report-trx --report-trx-filename apphost-tests.trx \
               --coverage --coverage-settings tests/coverage.config \
               --coverage-output-format cobertura --coverage-output apphost.cobertura.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/
          if-no-files-found: ignore
