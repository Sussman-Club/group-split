name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A new push to a PR supersedes the run already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The share of hand-written lines and branches the unit tests must keep
      # covered. Set to what was measured the day the gate went in, so it is a
      # ratchet against regression rather than a target: raise it when coverage
      # improves, and never lower it to turn a red build green.
      COVERAGE_LINE_FLOOR: 41
      COVERAGE_BRANCH_FLOOR: 32

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # GroupSplit.App (the MAUI head) targets android/ios/maccatalyst and is
      # deliberately excluded -- those need workloads, and ios/maccatalyst need
      # macOS. The AppHost reaches the MAUI and migrations projects by path
      # rather than ProjectReference, so neither is pulled in transitively:
      # migrations is listed explicitly, MAUI is left to a future macOS job.
      - name: Restore
        run: |
          dotnet restore tests/GroupSplit.API.Test/GroupSplit.API.Test.csproj
          dotnet restore tests/GroupSplit.App.Web.Test/GroupSplit.App.Web.Test.csproj
          dotnet restore tests/GroupSplit.AppHost.Test/GroupSplit.AppHost.Test.csproj
          dotnet restore src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj

      - name: Build
        run: |
          dotnet build tests/GroupSplit.API.Test/GroupSplit.API.Test.csproj -c Release --no-restore
          dotnet build tests/GroupSplit.App.Web.Test/GroupSplit.App.Web.Test.csproj -c Release --no-restore
          dotnet build tests/GroupSplit.AppHost.Test/GroupSplit.AppHost.Test.csproj -c Release --no-restore
          dotnet build src/GroupSplit.Data.PostgreSQL.Migrations/GroupSplit.Data.PostgreSQL.Migrations.csproj -c Release --no-restore

      # Everything above is Release, but `aspire do` builds Debug, so the deploy
      # workflow was the only thing exercising that configuration -- and some of it
      # is Debug-only. Hot-reload assets are the case that got through: they are
      # absent from a Release build, so a duplicate one in the WASM boot config
      # manifest failed GenerateWasmBootJson at deploy time and nowhere earlier.
      #
      # The web app pulls the WASM client, which is where that generation happens.
      # Build rather than publish: it covers the same targets in seconds, and the
      # deploy exercises publish itself.
      - name: Build the deploy configuration
        run: dotnet build src/GroupSplit.App/GroupSplit.App.Web/GroupSplit.App.Web.csproj -c Debug --no-restore

      # GroupSplit.AppHost.Test is built above but not run here. It had a job of its
      # own briefly; that job is out again because Chromium rejects the ASP.NET dev
      # certificate on a hosted runner -- ERR_CERT_AUTHORITY_INVALID as soon as
      # Playwright opens the web endpoint, which is trusted on a developer machine and
      # not on a runner. Run it locally with
      #
      #     dotnet test --project tests/GroupSplit.AppHost.Test/GroupSplit.AppHost.Test.csproj
      #
      # where it passes in about 40 seconds. See docs/qa/test-quality-and-coverage.md
      # for what it takes to bring the job back.
      - name: Test
        run: |
          # --results-directory stays ahead of the `--`: past it the CLI resolves the
          # value against the filesystem and rejects it as a positional path once the
          # directory exists, so the second invocation would fail where the first passed.
          dotnet test --project tests/GroupSplit.API.Test/GroupSplit.API.Test.csproj \
            -c Release --no-build --results-directory TestResults \
            -- --report-trx --report-trx-filename api-tests.trx \
               --coverage --coverage-settings tests/coverage.config \
               --coverage-output-format cobertura --coverage-output api.cobertura.xml
          dotnet test --project tests/GroupSplit.App.Web.Test/GroupSplit.App.Web.Test.csproj \
            -c Release --no-build --results-directory TestResults \
            -- --report-trx --report-trx-filename app-web-tests.trx \
               --coverage --coverage-settings tests/coverage.config \
               --coverage-output-format cobertura --coverage-output app-web.cobertura.xml

      # Merges the per-project Cobertura files into one report and renders the
      # summary onto the run's own page, so a reviewer sees the numbers without
      # downloading an artifact first.
      - name: Report coverage
        if: always()
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:'TestResults/*.cobertura.xml' \
            -targetdir:TestResults/coverage \
            -reporttypes:'Cobertura;Html;MarkdownSummaryGithub'
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Quietly covering less than it used to is the failure coverage exists to
      # catch, so this gates the build rather than only reporting.
      - name: Enforce the coverage floor
        if: always()
        run: |
          python3 tests/coverage-gate.py TestResults/coverage/Cobertura.xml \
            "$COVERAGE_LINE_FLOOR" "$COVERAGE_BRANCH_FLOOR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
