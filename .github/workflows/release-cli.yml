# Publishes the groupsplit CLI to GitHub Packages from protected integration branches.
#
#   main -> 0.0.4          a release. What `dotnet tool update` installs.
#   dev  -> 0.0.5-dev.213  a prerelease of the next patch. Only --prerelease sees it.
name: Release CLI

on:
  push:
    branches: [main, dev]
    # Only a push that touches the CLI publishes one; most commits here leave the packed
    # tool byte-identical. What is on the list and what it costs: docs/cli.md, "When
    # nothing is published".
    paths:
      - 'src/GroupSplit.Cli/**'
      - 'src/GroupSplit.Shared/**'
      - 'src/GroupSplit.API/**'
      - 'global.json'
      - '.github/workflows/release-cli.yml'

concurrency:
  # Never two publishes of one branch at once: on main they would race to claim the same
  # version number. The branches are independent, so they do not queue behind each other.
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A release writes its immutable cli-v tag and its package. This authority is never
    # available to dev builds.
    permissions:
      contents: write
      packages: write

    steps:
      # Full history and tags: MinVer and the release number both derive from them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # This is the only job that needs checkout's credential for `git push` below.
          persist-credentials: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # A published version cannot be replaced -- GitHub Packages refuses a re-push of the
      # same version -- so the tests run before anything leaves the machine.
      - name: Test
        run: dotnet test --project tests/GroupSplit.Cli.Test/GroupSplit.Cli.Test.csproj -c Release

      # Claim the next patch and write it as a cli-v tag, which MinVer then reads. A tag
      # already on the commit is reused so a GitHub re-run remains idempotent.
      - name: Claim the next version
        id: release
        run: |
          set -euo pipefail

          existing=$(git tag --points-at HEAD --list 'cli-v*' | head -1)
          if [[ -n "$existing" ]]; then
            echo "HEAD is already tagged $existing; reusing it."
            echo "name=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'cli-v*' --sort=-v:refname | head -1)
          if [[ -z "$latest" ]]; then
            next="0.0.1"
          else
            version=${latest#cli-v}
            IFS=. read -r major minor patch <<< "$version"
            next="${major}.${minor}.$((patch + 1))"
          fi

          echo "Last release: ${latest:-none}. Publishing $next."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "cli-v$next" -m "groupsplit $next"
          git push origin "cli-v$next"
          echo "name=cli-v$next" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/GroupSplit.Cli/GroupSplit.Cli.csproj -c Release -o artifacts/nupkg

      - name: Check the release version
        run: |
          set -euo pipefail
          package=$(ls artifacts/nupkg/*.nupkg)
          version=$(basename "$package" .nupkg | sed 's/^GroupSplit\.Cli\.//')
          echo "Packed version: $version"
          if [[ "$version" == *-* ]]; then
            echo "::error::main produced prerelease '$version'." \
                 "MinVer did not see the cli-v tag."
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "artifacts/nupkg/*.nupkg" \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Summary
        run: |
          {
            echo "### groupsplit ${{ steps.release.outputs.name }}"
            echo
            printf '```bash\n%s\n```\n' "dotnet tool update --global GroupSplit.Cli"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-prerelease:
    name: Publish prerelease
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A dev build may publish a prerelease package but can never create repository content.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test --project tests/GroupSplit.Cli.Test/GroupSplit.Cli.Test.csproj -c Release

      # A release tag lives on main rather than dev, so calculate the next patch from all
      # tags and use the dev commit height to make prereleases strictly increasing.
      - name: Compute the prerelease version
        id: prerelease
        run: |
          set -euo pipefail

          latest=$(git tag --list 'cli-v*' --sort=-v:refname | head -1)
          if [[ -z "$latest" ]]; then
            next="0.0.1"
          else
            version=${latest#cli-v}
            IFS=. read -r major minor patch <<< "$version"
            next="${major}.${minor}.$((patch + 1))"
          fi

          version="$next-dev.$(git rev-list --count HEAD)"
          echo "Last release: ${latest:-none}. Publishing prerelease $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack src/GroupSplit.Cli/GroupSplit.Cli.csproj -c Release -o artifacts/nupkg \
            -p:MinVerVersionOverride=${{ steps.prerelease.outputs.version }}

      - name: Check the prerelease version
        run: |
          set -euo pipefail
          package=$(ls artifacts/nupkg/*.nupkg)
          version=$(basename "$package" .nupkg | sed 's/^GroupSplit\.Cli\.//')
          echo "Packed version: $version"
          if [[ "$version" != *-* ]]; then
            echo "::error::dev produced release version '$version', which would shadow a real release."
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "artifacts/nupkg/*.nupkg" \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Summary
        run: |
          {
            echo "### groupsplit ${{ steps.prerelease.outputs.name }}"
            echo
            printf '```bash\n%s\n```\n' "dotnet tool update --global GroupSplit.Cli --prerelease"
          } >> "$GITHUB_STEP_SUMMARY"
